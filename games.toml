# Catalog schema: each [[games]] entry requires a unique `key` matching
# `rs-`-prefixed kebab-case, localized titles and summaries, and a tag list.
# The key is also the GitHub repository name and the submodule path `games/<key>`.

[[games]]
key = "rs-nim"                       # Directory name = submodule path games/<key> = GitHub repository name
title = "Nim"
title_ja = "ニム"
summary = "Play Nim against a CPU (normal / misère), learn the nim-sum, and replay recorded games."
summary_ja = "CPU と対戦する Nim（通常・ミゼール）．ニム和で必勝法を学べ，棋譜のリプレイ・録画にも対応．"
tags = ["strategy", "ratatui", "tui"]

[[games]]
key = "rs-tic-tac-toe"
title = "Tic-tac-toe"
title_ja = "三目並べ"
summary = "Play tic-tac-toe against a CPU that reads the whole game tree, see every move evaluated as win / draw / loss, and replay recorded games."
summary_ja = "ゲーム木を読み切る CPU と対戦する三目並べ．各マスの勝ち・引分・負けを表示でき，棋譜のリプレイ・録画にも対応．"
tags = ["strategy", "minimax", "ratatui", "tui"]

[[games]]
key = "rs-connect-four"
title = "Connect Four"
title_ja = "四目並べ"
summary = "Play Connect Four on any board from 4 x 4 to 10 x 9 against an alpha-beta CPU, see every column evaluated, and replay recorded games."
summary_ja = "4 × 4〜10 × 9 の盤で αβ 探索の CPU と対戦する四目並べ．各列の評価を表示でき，棋譜のリプレイ・録画にも対応．"
tags = ["strategy", "alpha-beta", "ratatui", "tui"]

[[games]]
key = "rs-gomoku"
title = "Gomoku"
title_ja = "五目並べ"
