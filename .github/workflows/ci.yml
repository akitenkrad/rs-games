name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test catalog tooling
        run: python3 -m unittest discover -s tests -v
      - name: Check generated catalog
        shell: bash
        run: |
          if ! python3 scripts/gen_catalog.py --check; then
            echo "::error::Catalog is stale; run python3 scripts/gen_catalog.py and commit the generated README changes."
            exit 1
          fi

  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test every game
        shell: bash
        run: |
          set -euo pipefail
          # Extra cargo test arguments per game. rs-typing-trainer's tests take
          # ~14 min in debug on the runner, so they run with optimizations.
          # Its tests/perf checks absolute timings, which are too tight for a
          # shared runner in release mode; this CI only smoke-tests the games,
          # so it runs the library, binary and tests/all targets only.
          while IFS= read -r key; do
            args=(--locked)
            case $key in
              rs-typing-trainer) args+=(--release --lib --bins --test all) ;;
            esac
            echo "::group::cargo test ${args[*]} ($key)"
            (cd "games/$key" && cargo test "${args[@]}")
            echo "::endgroup::"
          done < <(python3 - <<'PY'
          import tomllib

          with open("games.toml", "rb") as handle:
              for game in tomllib.load(handle)["games"]:
                  print(game["key"])
          PY
          )
